<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Pop Everything!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:linear-gradient(180deg,#8fdcff 0%,#d9f5ff 55%,#fff1c7 100%);color:#28304a}
.app{height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 8px;text-align:center;position:relative;z-index:5}
h1{margin:0;font-size:30px;font-weight:900}
.subtitle{margin-top:3px;font-size:14px;font-weight:700;color:#5f6880}
.stats{display:flex;justify-content:center;gap:12px;margin-top:8px}
.pill{background:#fff;border-radius:999px;padding:7px 13px;font-weight:900;box-shadow:0 4px 14px #28304a18}
#game{position:relative;flex:1;overflow:hidden;touch-action:manipulation}
.bubble{position:absolute;border:0;border-radius:50%;cursor:pointer;box-shadow:inset -8px -10px 16px #00000018,inset 7px 6px 12px #ffffff80,0 7px 14px #28304a22;animation:floatUp var(--dur) linear forwards}
.bubble:after{content:"";position:absolute;width:28%;height:20%;border-radius:50%;background:#fff9;top:16%;left:19%;transform:rotate(-25deg)}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-125vh) rotate(35deg)}}
.pop{position:absolute;pointer-events:none;font-size:46px;font-weight:1000;z-index:10;animation:pop .55s ease-out forwards}
.picturePop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.4);font-size:105px;z-index:12;pointer-events:none;animation:picturePop 2.8s ease-in-out forwards;text-align:center}
.pictureLabel{display:block;margin-top:4px;font-size:24px;font-weight:1000;color:#28304a;text-shadow:0 2px 8px #fff}
@keyframes picturePop{0%{transform:translate(-50%,-50%) scale(.35);opacity:0}20%{transform:translate(-50%,-50%) scale(1.2);opacity:1}65%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-58%) scale(.8);opacity:0}}
.celebrate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:13;pointer-events:none;font-size:44px;font-weight:1000;animation:celebrate .95s ease-out forwards}
@keyframes celebrate{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.2)}}
.surpriseBubble{box-shadow:inset -8px -10px 16px #0002,inset 7px 6px 12px #fff9,0 0 0 6px #ffd95a55,0 8px 18px #28304a30!important}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}35%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.spark{position:absolute;pointer-events:none;font-size:22px;z-index:9;animation:spark .8s ease-out forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(180deg);opacity:0}}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:#ffffff22;backdrop-filter:blur(2px)}
.start button{border:0;background:#fff;border-radius:28px;padding:24px 34px;font-size:27px;font-weight:1000;color:#6b55e8;box-shadow:0 12px 35px #28304a30;cursor:pointer}
.controls{position:absolute;left:12px;right:12px;bottom:12px;z-index:15;display:flex;justify-content:center;gap:8px;pointer-events:none}
.control{pointer-events:auto;border:0;background:#fff;border-radius:18px;padding:10px 15px;font-size:14px;font-weight:900;box-shadow:0 5px 16px #28304a20}
#colorMode{display:none}
@media(max-width:430px){h1{font-size:26px}.subtitle{font-size:12px}.bubble{min-width:55px;min-height:55px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🎈 Pop Everything!</h1>
  <div class="subtitle">Pop, see, hear and learn! 🎈</div>
  <div class="stats">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill">🎈 <span id="count">0</span></div>
  </div>
  <div id="learningText" style="margin-top:8px;font-size:20px;font-weight:1000;min-height:28px;">Let's learn ABC! 🎈</div>
</header>
<main id="game">
  <div class="start" id="start"><button id="startBtn">👆 Start Popping!</button></div>
</main>
<div class="controls">
  <button class="control" id="soundBtn">🔊 Sound On</button>
  <button class="control" id="newBtn">✨ New Bubbles</button>
</div>
</div>
<script>
const game=document.getElementById('game');
const scoreEl=document.getElementById('score');
const countEl=document.getElementById('count');
const start=document.getElementById('start');
let score=0,count=0,sound=true,audioCtx=null,started=false;
const colors=['#ff6b8a','#ffb84d','#ffe05c','#5edb8a','#5ec8ff','#8f78ff','#ef72d0'];

function audio(){
  if(!sound)return null;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch(e){return null}
}
function popSound(){
  const c=audio(); if(!c)return;
  const now=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(520,now);o.frequency.exponentialRampToValueAtTime(120,now+.12);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.13);
  o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+.14);
}
function cheer(){
  const c=audio(); if(!c)return;
  const now=c.currentTime;
  [660,880,1047].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,now+i*.06);g.gain.exponentialRampToValueAtTime(.09,now+i*.06+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.06+.18);
    o.connect(g);g.connect(c.destination);o.start(now+i*.06);o.stop(now+i*.06+.2);
  });
}
function burst(x,y){
  ['✨','⭐','💫','🎉','✨','⭐'].forEach((s,i)=>{
    const e=document.createElement('div');e.className='spark';e.textContent=s;e.style.left=x+'px';e.style.top=y+'px';
    const a=(Math.PI*2*i/6),d=45+Math.random()*35;
    e.style.setProperty('--x',(Math.cos(a)*d)+'px');e.style.setProperty('--y',(Math.sin(a)*d)+'px');
    game.appendChild(e);setTimeout(()=>e.remove(),700);
  });
}
const animalSounds = {
  Cat:'Meow!',
  Dog:'Woof!',
  Elephant:'Trumpet!',
  Fish:'Blub blub!',
  Lion:'Roar!',
  Monkey:'Ooh ooh ah ah!',
  Parrot:'Squawk!',
  Rabbit:'Squeak!',
  Tiger:'Roar!',
  Whale:'Whoosh!'
};

const lessons = [
  ['A','Apple','🍎'],['B','Ball','⚽'],['C','Cat','🐱'],['D','Dog','🐶'],
  ['E','Elephant','🐘'],['F','Fish','🐟'],['G','Grapes','🍇'],['H','Hat','🎩'],
  ['I','Ice Cream','🍦'],['J','Juice','🧃'],['K','Kite','🪁'],['L','Lion','🦁'],
  ['M','Monkey','🐒'],['N','Nest','🪺'],['O','Orange','🍊'],['P','Parrot','🦜'],
  ['Q','Queen','👑'],['R','Rabbit','🐰'],['S','Sun','☀️'],['T','Tiger','🐯'],
  ['U','Umbrella','☂️'],['V','Van','🚐'],['W','Whale','🐳'],['X','Xylophone','🎵'],
  ['Y','Yo-yo','🪀'],['Z','Zebra','🦓']
];
let lessonIndex = 0;
let currentBubble = null;
let popNumber = 0;

function showPicture(word, picture) {
  const holder = document.createElement('div');
  holder.className = 'picturePop';
  holder.innerHTML = picture + '<span class="pictureLabel">' + word + '</span>';
  game.appendChild(holder);
  setTimeout(() => holder.remove(), 2800);
}

function showCelebration(text) {
  const e = document.createElement('div');
  e.className = 'celebrate';
  e.textContent = text;
  game.appendChild(e);
  setTimeout(() => e.remove(), 1000);
}

function makeSurpriseBubble() {
  if (!started || currentBubble) return;
  const b = document.createElement('button');
  b.className = 'bubble surpriseBubble';
  const size = 92;
  b.style.width=size+'px'; b.style.height=size+'px';
  b.style.left=(50-(size/2/game.clientWidth*100))+'%';
  b.style.top='78%';
  b.style.background='#ffd95a';
  b.style.setProperty('--dur','10s');
  b.setAttribute('aria-label','Surprise balloon');
  b.innerHTML='<span style="font-size:42px;font-weight:1000;color:white;text-shadow:0 2px 4px #0004">🎁</span>';
  currentBubble=b;
  game.appendChild(b);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    count++;
    score++;
    scoreEl.textContent=score; countEl.textContent=count;
    document.getElementById('learningText').textContent='Surprise! 🎉';
    popSound(); burst(x,y); cheer(); showCelebration('🎉 WOW! 🌈 ⭐');
    showPicture('Surprise!', ['🌈','🦋','⭐','🎉','🐶','🦄'][Math.floor(Math.random()*6)]);
    b.remove(); currentBubble=null;
    setTimeout(makeBubble,900);
  },{passive:false});

  setTimeout(()=>{
    if(currentBubble===b){ b.remove(); currentBubble=null; setTimeout(makeBubble,500); }
  },10000);
}

function speakLesson(letter, word) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(letter + ' for ' + word);
      u.rate = 0.78;
      u.pitch = 1.15;
      u.volume = 1;
      window.speechSynthesis.speak(u);

      if (animalSounds[word]) {
        u.onend = () => {
          const s = new SpeechSynthesisUtterance(animalSounds[word]);
          s.rate = 0.82;
          s.pitch = 1.18;
          s.volume = 1;
          window.speechSynthesis.speak(s);
        };
      }
    }
  } catch(e) {}
}

function makeBubble(){
  if(!started || currentBubble) return;
  const [letter,word,picture] = lessons[lessonIndex];
  const b=document.createElement('button');
  b.className='bubble';
  const size=82;
  b.style.width=size+'px'; b.style.height=size+'px';
  b.style.left=(50-(size/2/game.clientWidth*100))+'%';
  b.style.top='78%';
  b.style.background=colors[lessonIndex % colors.length];
  b.style.setProperty('--dur','11s');
  b.setAttribute('aria-label', letter + ' for ' + word);
  b.innerHTML='<span style="font-size:42px;font-weight:1000;color:white;text-shadow:0 2px 4px #0004">'+letter+'</span>';
  currentBubble=b;
  game.appendChild(b);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    score++; count++; popNumber++;
    scoreEl.textContent=score; countEl.textContent=count;

    const message = document.getElementById('learningText');
    message.textContent = letter + ' for ' + word + ' ' + picture;
    speakLesson(letter, word);
    popSound(); burst(x,y);
    showPicture(word, picture);
    if (popNumber % 5 === 0) showCelebration('🎉 Great job! ⭐');

    const p=document.createElement('div');
    p.className='pop';
    p.textContent=picture;
    p.style.left=x+'px'; p.style.top=y+'px';
    game.appendChild(p);
    setTimeout(()=>p.remove(),800);

    b.remove();
    currentBubble=null;
    lessonIndex=(lessonIndex+1)%lessons.length;

    if(score%10===0) cheer();
    setTimeout(() => {
      if (started && !currentBubble && popNumber % 7 === 0) makeSurpriseBubble();
      else makeBubble();
    },3200);
  },{passive:false});

  setTimeout(()=>{
    if(currentBubble===b){
      b.remove();
      currentBubble=null;
      setTimeout(makeBubble,500);
    }
  },11000);
}

function refill(){
  document.querySelectorAll('.bubble').forEach(x=>x.remove());
  currentBubble=null;
  makeBubble();
}
document.getElementById('startBtn').addEventListener('pointerdown',()=>{
  started=true;start.style.display='none';audio();refill();
});
document.getElementById('soundBtn').addEventListener('pointerdown',()=>{
  sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊 Sound On':'🔇 Sound Off';
  if(sound)audio();
});
document.getElementById('newBtn').addEventListener('pointerdown',()=>{if(started)refill()});

</script>
</body>
</html>
